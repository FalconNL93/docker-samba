name: ci

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: samba
  IMAGE_TAG: latest
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert owner to lowercase
        id: lower-repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_OUTPUT
          echo "dockerhub=${DOCKERHUB_USER@L}" >> $GITHUB_OUTPUT
        env:
          DOCKERHUB_USER: ${{secrets.DOCKERHUB_USERNAME}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY_GHCR}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY_DOCKERHUB}}
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{env.REGISTRY_GHCR}}/${{steps.lower-repo.outputs.owner}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
            ${{steps.lower-repo.outputs.dockerhub}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
